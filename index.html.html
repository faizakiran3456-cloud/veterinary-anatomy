<title>Veterinary Anatomy Catalogue</title>

<style>
:root{
  --bg:#dcecfa; --bg2:#eaf4fd; --card:#ffffff; --ink:#0f2a47; --muted:#4d6784;
  --line:#b9d3ea; --accent:#1d5fa6; --accent-ink:#ffffff; --head:#123a66; --head-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e1b2b;--bg2:#12253a;--card:#172f48;--ink:#e7f1fb;--muted:#9db6cf;--line:#29496b;--accent:#6db3f2;--accent-ink:#0b1a2b;--head:#0a2340;--head-ink:#ffffff;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1b2b;--bg2:#12253a;--card:#172f48;--ink:#e7f1fb;--muted:#9db6cf;--line:#29496b;--accent:#6db3f2;--accent-ink:#0b1a2b;--head:#0a2340;--head-ink:#ffffff;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
header{background:var(--head);color:var(--head-ink);padding:26px 20px;text-align:center}
.dept{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:clamp(24px,6vw,38px);line-height:1.2;text-wrap:balance}
main{max-width:1000px;margin:0 auto;padding:26px 16px 40px}
.search{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:10px}
input[type=search]{flex:1;min-width:0;font:inherit;font-size:20px;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=search]:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:0 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.ghost{background:transparent;color:var(--accent);border:2px solid var(--line)}
.all{padding:10px 18px;background:transparent;color:var(--accent);border:2px solid var(--accent)}
.all[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.hint{margin:10px 0 0;color:var(--muted);font-size:15px}
.count{margin:0 0 10px;color:var(--muted);font-weight:600;min-height:1.5em}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--head);color:var(--head-ink);font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:var(--bg2)}
td.n{color:var(--muted)} td.d{font-weight:700;color:var(--accent);white-space:nowrap} td.y{white-space:nowrap}
mark{background:rgba(255,205,60,.6);color:inherit;border-radius:3px;padding:0 1px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:520px){button{padding:0 14px}}
</style>
</head>

  <p class="count" id="count" role="status" aria-live="polite"></p>
  <div class="wrap" id="wrap" hidden><table>

    <tbody id="body"></tbody>
  </table></div>

function render(){

  let y1=0,y2=0,terms=[];
  const m=q.match(/^(\d{4})\s*(?:-|to)\s*(\d{4})$/);
  if(m){y1=+m[1];y2=+m[2]}else terms=q.split(/\s+/).filter(Boolean);
  const r=BOOKS.filter(b=>{
    if(y1){const y=parseInt(b.year);return y>=y1&&y<=y2}
    const hay=norm([b.ddc,b.title,b.auth,b.year,b.acc].join(' | '));
    return terms.every(t=>hay.includes(t))});
